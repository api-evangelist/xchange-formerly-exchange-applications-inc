name: xchange (Formerly Exchange Applications Inc.)
description: 'Xchange Inc., formerly Exchange Applications Inc., was a Boston-based (89 South
  Street, Boston, MA) customer relationship marketing software company that helped enterprises
  earn a greater share of their customers'' business through relevant, personalized customer
  communications, selling campaign-management and customer-analytics software. A Delaware
  corporation backed by Insight Partners, it went public in 1998 (S-1 filed 1998-07-22, SEC CIK
  0001065857, SIC 7373 Computer Integrated Systems Design). The company went dark after its
  final 10-Q on 2002-11-19, and the SEC revoked its Exchange Act registration on 2011-01-07.
  Both historical domains are now parked: xchange.com carries no A record and
  exchangeapplications.com is a domain-for-sale lander. The company is defunct with no website,
  developer surface, or APIs; this profile is retained as a historical portfolio-lead record.'
